
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendEase | Attendance Calendar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f5f6fb;
    color: #292b40;
}
.layout {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 250px;
    min-height: 100vh;
    background: white;
    padding: 30px 22px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    box-shadow: 2px 0 15px rgba(0,0,0,0.04);
}

.brand {
    font-size: 23px;
    font-weight: bold;
    color: #6555d9;
    margin-bottom: 35px;
}

.brand span {
    color: #292b40;
}

.menu-label {
    font-size: 11px;
    font-weight: 700;
    color: #a0a5b5;
    letter-spacing: 1.5px;
    margin-bottom: 15px;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.nav a {
    text-decoration: none;
    color: #77788c;
    padding: 13px 15px;
    border-radius: 10px;
    font-size: 14px;
    transition: 0.2s;
}

.nav a:hover {
    background: #f3f1ff;
    color: #6555d9;
}

.nav a.active {
    background: #eeebff;
    color: #6555d9;
    font-weight: 600;
}

.logout {
    margin-top: auto;
    text-decoration: none;
    color: #77788c;
    padding: 13px 15px;
    border-radius: 10px;
}

.logout:hover {
    background: #fff0f0;
    color: #d9534f;
}
.container {
    flex: 1;
    min-width: 0;
    max-width: none;
    margin: 0;
    padding: 40px;
}

.header {
    margin-bottom: 25px;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.header p {
    color: #88889a;
}

.calendar {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.04);
    width: 100%;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.calendar-header h2 {
    font-size: 22px;
}

.calendar-header button {
    background: #6555d9;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    cursor: pointer;
}

.weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    gap: 10px;
}

.weekdays div {
    color: #88889a;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 0;
}

.days div {
    min-height: 65px;
    padding: 15px 5px;
    border-radius: 12px;
    background: #f8f8fc;
    display: flex;
    align-items: center;
    justify-content: center;
}

.days div.present {
    background: #e1f6e9;
    color: #168344;
}

.days div.absent {
    background: #fde6e6;
    color: #c0392b;
}

.days div.late {
    background: #fff1db;
    color: #b87512;
}

.days div.empty {
    background: transparent;
}

.legend {
    display: flex;
    gap: 20px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #666;
}

.dot {
    height: 10px;
    width: 10px;
    border-radius: 50%;
}

.green { background: #35a765; }
.red { background: #e25a5a; }
.orange { background: #e5a33d; }

.back {
    display: inline-block;
    margin-bottom: 25px;
    color: #6555d9;
    text-decoration: none;
    font-weight: 600;
}

.container > .back {
    padding: 10px 0;
}
@media(max-width: 600px) {
    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        min-height: auto;
        padding: 20px;
    }

    .nav {
        gap: 5px;
    }

    .logout {
        margin-top: 15px;
    }

    .container {
        padding: 15px;
        margin: 15px auto;
    }

    .calendar {
        padding: 15px;
    }

    .days div {
        min-height: 45px;
        padding: 8px 2px;
        font-size: 13px;
    }

    .weekdays div {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">

    <div class="brand">
        Attend<span>Ease</span>
    </div>

    <p class="menu-label">WORKSPACE</p>

    <nav class="nav">

        <a href="{{ url_for('student_dashboard') }}" onclick="window.location.assign(this.href); return false;">
            ◈ &nbsp; Overview
        </a>

        <a href="{{ url_for('my_attendance') }}" onclick="window.location.assign(this.href); return false;">
            ▤ &nbsp; My Attendance
        </a>

        <a href="{{ url_for('attendance_calendar') }}" class="active" onclick="window.location.assign(this.href); return false;">
            ▦ &nbsp; Attendance Calendar
        </a>

        <a href="{{ url_for('student_profile') }}" onclick="window.location.assign(this.href); return false;">
            ◉ &nbsp; My Profile
        </a>

        <a href="{{ url_for('notifications') }}" onclick="window.location.assign(this.href); return false;">
            ♧ &nbsp; Notifications
        </a>
        <a href="{{ url_for('student_settings') }}">
    ⚙ &nbsp; Settings
</a>
    </nav>

    <a href="{{ url_for('home') }}" class="logout">
        ↪ &nbsp; Sign Out
    </a>

</aside>

<div class="container">
<a href="/student_dashboard" class="back">← Back to Overview</a>

<div class="header">
    <h1>Attendance Calendar</h1>
    <p>View your attendance day by day.</p>
</div>

<div class="calendar">

<div class="calendar-header">
    <button onclick="changeMonth(-1)">←</button>
    <h2 id="monthYear"></h2>
    <button onclick="changeMonth(1)">→</button>
</div>

<div class="weekdays">
    <div>Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
</div>

<div class="days" id="calendarDays"></div>

<div class="legend">
    <span><i class="dot green"></i> Present</span>
    <span><i class="dot red"></i> Absent</span>
    <span><i class="dot orange"></i> Late</span>
</div>

</div>
</div>

<script>
const records = [
    {% for record in records %}
    {
        date: "{{ record['attendance_date'] }}",
        status: "{{ record['status'] }}"
    },
    {% endfor %}
];

let currentDate = new Date();
currentDate.setDate(1);

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthYear").textContent =
        currentDate.toLocaleString('default', {
            month: 'long',
            year: 'numeric'
        });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const calendarDays = document.getElementById("calendarDays");
    calendarDays.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "empty";
        calendarDays.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.textContent = day;

        const dateString =
            year + "-" +
            String(month + 1).padStart(2, '0') + "-" +
            String(day).padStart(2, '0');

        const record = records.find(r => r.date === dateString);

        if (record) {
            const status = record.status.toLowerCase();

            if (status === "present") {
                cell.classList.add("present");
            } else if (status === "absent") {
                cell.classList.add("absent");
            } else if (status === "late") {
                cell.classList.add("late");
            }
        }

        calendarDays.appendChild(cell);
    }
}

function changeMonth(direction) {
    currentDate.setMonth(currentDate.getMonth() + direction);
    renderCalendar();
}

renderCalendar();
</script>

</body>
</html>
