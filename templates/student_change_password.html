
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendEase | Change Password</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f5fa;
    color: #333;
}

.container {
    max-width: 600px;
    margin: 60px auto;
    padding: 35px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

h1 {
    margin-bottom: 10px;
    color: #6555d9;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #6555d9;
}

button {
    width: 100%;
    padding: 14px;
    background: #6555d9;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #6555d9;
    text-decoration: none;
}

.flash {
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #fce8e8;
    color: #b42318;
}
</style>
</head>

<body>

<div class="container">

    <h1>Change Password</h1>
    <p class="subtitle">Update your account password securely.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="form-group">
            <label>Current Password</label>
            <div style="display:flex;gap:8px;">
    <input type="password" name="current_password" id="currentPassword" required style="flex:1;">
    <button type="button" onclick="togglePassword('currentPassword', this)" style="width:auto;padding:10px;background:#eee;color:#333;">Show</button>
</div>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <div style="display:flex;gap:8px;">
    <input type="password" name="new_password" id="newPassword" minlength="8" required style="flex:1;">
    <button type="button" onclick="togglePassword('newPassword', this)" style="width:auto;padding:10px;background:#eee;color:#333;">Show</button>
</div>
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <div style="display:flex;gap:8px;">
    <input type="password" name="confirm_password" id="confirmPassword" minlength="8" required style="flex:1;">
    <button type="button" onclick="togglePassword('confirmPassword', this)" style="width:auto;padding:10px;background:#eee;color:#333;">Show</button>
</div>
        </div>

        <button type="submit">Update Password</button>

    </form>

    <a href="{{ url_for('student_settings') }}" class="back-link">
        ← Back to Settings
    </a>

</div>
<script>
function togglePassword(id, button) {
    const field = document.getElementById(id);

    if (field.type === "password") {
        field.type = "text";
        button.textContent = "Hide";
    } else {
        field.type = "password";
        button.textContent = "Show";
    }
}
</script>
</body>
</html>
